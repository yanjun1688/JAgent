[project]
name = "jagent"
version = "0.1.0"
description = "JAgent - Agent-First Task Execution Engine (v8)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "aiosqlite>=0.20",
    "jsonschema>=4.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "pyjwt[crypto]>=2.8",
    "langfuse>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-watch>=4.0",
    "pre-commit>=4.0",
    "ruff>=0.15.15",
    "tiktoken>=0.7.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 默认排除真实 LLM/MCP 测试（会花钱、会受网络影响）。
# 要跑它们：pytest -m llm tests/e2e_live
addopts = ["--strict-markers", "-m", "not llm"]
markers = [
    "known_bug(id, reason): tracked defect; strict xfail until the bug is fixed",
    "engineering: engineering/architecture test without a BDD scenario (must name its milestone)",
    "llm: requires a real LLM API key; opt-in only (JAGENT_REAL_LLM=1)",
]

[tool.uvicorn]
reload_excludes = [
    "__pycache__/**",
    "*.pyc",
    ".git/**",
    "data/**",
    ".venv/**",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
