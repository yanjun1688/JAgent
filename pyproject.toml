[project]
name = "harness"
version = "0.1.0"
description = "Harness - Agent-First Task Execution Engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "aiosqlite>=0.20",
    "jsonschema>=4.0",
    "httpx>=0.27",
    "playwright>=1.40",
    "mcp>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12",
    "langfuse>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-watch>=4.0",
    "pre-commit>=4.0",
    "ruff>=0.15.15",
    "tiktoken>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uvicorn]
reload_excludes = [
    "__pycache__/**",
    "*.pyc",
    ".git/**",
    "data/**",
    ".venv/**",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "harness.core.dag_executor",
    "harness.tools.executor",
    "harness.monitoring.run_monitor",
    "harness.core.scheduler.base",
    "harness.tools.mcp_manager",
    "harness.tools.mcp_call",
    "harness.api.deps",
    "harness.api.analysis_routes",
    "harness.api.routes",
    "harness.api.app",
    "harness.api.serve",
]
disable_error_code = ["arg-type", "assignment", "attr-defined", "call-arg", "no-redef", "union-attr"]
