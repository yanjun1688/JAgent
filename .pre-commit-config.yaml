repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check harness tests scripts
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy (project venv via uv; never global python -m mypy)
        entry: uv run mypy harness
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: dead-code
        name: dead private-symbol check
        entry: uv run python scripts/check_dead_code.py harness evaluation scripts
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: openapi-diff
        name: OpenAPI artifacts in sync (scripts/generate_openapi.py --check)
        entry: uv run python scripts/generate_openapi.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: bug-summary
        name: validate Bug summary
        entry: uv run pytest tests/test_bug_summary.py -q
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: run tests
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
