name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python:
    name: lint · tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Ruff
        # scripts/ 按仓库约定本地维护、不入公开库（D-034 re-baseline）——
        # 本地 pre-commit 仍跑 `ruff check jagent tests scripts`，CI 只查已发布树。
        run: uv run ruff check jagent tests

      - name: Pytest
        run: uv run pytest -q tests
