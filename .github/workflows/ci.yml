name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: lint · types · contract gates · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Ruff
        run: uv run ruff check harness tests scripts

      - name: Mypy
        run: uv run mypy harness

      - name: OpenAPI artifacts up to date
        run: uv run python scripts/generate_openapi.py --check

      - name: Pytest
        run: uv run pytest -q
